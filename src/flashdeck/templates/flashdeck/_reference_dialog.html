<dialog class="flashdeck-dialog" data-flashdeck-dialog aria-label="Reference">
  <div class="flashdeck-dialog-bar">
    <button type="button" class="flashdeck-link" data-flashdeck-back hidden>Back</button>
    <span class="flashdeck-muted">Reference{% if looking_up %}: looking something up makes a right answer count as nearly right{% endif %}</span>
    <button type="button" class="flashdeck-button" data-flashdeck-close>Close</button>
  </div>
  <div class="flashdeck-dialog-body" data-flashdeck-dialog-body></div>
</dialog>
