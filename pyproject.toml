[project]
name = "django-flashdeck"
version = "0.1.0"
description = "Flashcards for Django sites: decks of cards with typed answers, marked right or wrong, and spaced repetition."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Christian Hill" }]
requires-python = ">=3.12"
keywords = ["django", "wagtail", "flashcards", "spaced repetition", "fsrs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = [
    "django>=5.2",
    "django-modelcluster>=6.0",
    "fsrs>=6.3.2",
    "markdown>=3.11.1",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
wagtail = ["wagtail>=7.0"]

[project.urls]
Homepage = "https://github.com/xnx/django-flashdeck"
Changelog = "https://github.com/xnx/django-flashdeck/blob/main/CHANGELOG.md"
Decks = "https://github.com/xnx/flashcard-decks"

[dependency-groups]
dev = ["pytest", "pytest-django", "ruff"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flashdeck"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
# A warning raised in the package's own code, such as of a deprecation, fails.
filterwarnings = ["error:::flashdeck"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "."]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]  # line length is left to `ruff format`
