[project]
name = "django-flashdeck"
version = "0.1.0"
description = "Flashcards for Django sites: decks of cards with typed answers, marked right or wrong, and spaced repetition."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Framework :: Django",
    "Framework :: Wagtail",
    # Stops an accidental upload to PyPI until a licence has been chosen.
    "Private :: Do Not Upload",
]
dependencies = [
    "django>=5.2",
    "django-modelcluster>=6.0",
    "fsrs>=6.3.2",
    "markdown>=3.11.1",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
wagtail = ["wagtail>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flashdeck"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "."]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]  # line length is left to `ruff format`
